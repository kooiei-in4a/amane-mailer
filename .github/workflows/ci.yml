name: CI

# CI tiers (single workflow + job-level `if`; job names unchanged for branch protection):
# - feature/** / fix/** push: build-test only
# - develop push or PR targeting develop: build-test + openapi-validation + native-aot-smoke
# - PR targeting main: release-gate CI (incl. Native AOT, amd64 Docker)
# - main push, workflow_dispatch: final CI (incl. Native AOT, amd64/arm64 Docker)
# Fail-secure: workflow_dispatch and unrecognized paths use final CI when triggered.

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release

jobs:
  build-test:
    name: Restore, build, and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Amane.Mailer.slnx --locked-mode

      - name: Verify C# whitespace formatter
        run: dotnet format whitespace Amane.Mailer.slnx --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build Amane.Mailer.slnx -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test Amane.Mailer.slnx -c ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: PTY smoke (ACS test-acs-send interactive paths)
        run: python3 scripts/pty-smoke-test-acs-send.py

  sdk-tests:
    name: Consumer SDK tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test Python SDK
        working-directory: sdk/python
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  native-aot-smoke:
    name: Native AOT publish smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main' ||
      github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang zlib1g-dev

      - name: Restore
        run: dotnet restore Amane.Mailer.slnx --locked-mode

      - name: Publish linux-x64 Native AOT
        run: >
          dotnet publish src/Amane.Mailer/Amane.Mailer.csproj
          -c ${{ env.CONFIGURATION }}
          -r linux-x64
          --self-contained
          --no-restore
          -o artifacts/publish/aot-linux-x64
          /p:PublishAot=true
          /p:IlcTreatWarningsAsErrors=true

      - name: Run published binary
        run: |
          test -x artifacts/publish/aot-linux-x64/Amane.Mailer
          artifacts/publish/aot-linux-x64/Amane.Mailer --help

      # Low-frequency Native AOT paths (Admin / webhook HTTPS tenant / db backup).
      # Complements release-smoke (core API + Mailpit on the GHCR image). See #286.
      - name: Native AOT low-frequency path smoke
        env:
          MAILER_BIN: ${{ github.workspace }}/artifacts/publish/aot-linux-x64/Amane.Mailer
        run: bash scripts/native-aot-path-smoke.sh

  docker-build-smoke:
    name: Docker build smoke (${{ matrix.platform }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && '{"include":[{"platform":"linux/amd64","tag_suffix":"linux-amd64"},{"platform":"linux/arm64","tag_suffix":"linux-arm64"}]}' || '{"include":[{"platform":"linux/amd64","tag_suffix":"linux-amd64"}]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build Mailer image
        run: >
          docker buildx build
          --platform ${{ matrix.platform }}
          --file infra/docker/Dockerfile
          --tag amane-mailer:ci-smoke-${{ matrix.tag_suffix }}
          --load
          .

      - name: Run Mailer image
        run: >
          docker run
          --rm
          --platform ${{ matrix.platform }}
          amane-mailer:ci-smoke-${{ matrix.tag_suffix }}
          --help

  docker-build-smoke-required:
    name: Docker build smoke
    # Always run so required status check reports success when the matrix is skipped
    # on light CI paths (needs + matching if would skip this job and leave checks pending).
    if: always()
    runs-on: ubuntu-24.04
    needs: docker-build-smoke
    steps:
      - name: Confirm platform smoke matrix
        run: |
          result="${{ needs.docker-build-smoke.result }}"
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            echo "Docker build smoke gate passed (matrix result: $result)."
          else
            echo "Docker build smoke matrix failed (result: $result)."
            exit 1
          fi


  oci-promote-self-test:
    name: OCI promote digest-preservation self-test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main' ||
      startsWith(github.head_ref, 'release-infra/') ||
      startsWith(github.ref_name, 'release-infra/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Run candidate-run validator self-test (fixtures)
        run: bash scripts/validate-candidate-oci-run-self-test.sh

      - name: Run promote self-test (local registry)
        run: bash scripts/promote-candidate-oci-self-test.sh

  local-compose-fresh-data:
    name: Local compose fresh data dir
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify fresh bind mount SQLite init
        env:
          LOCAL_FRESH_DATA_RESET: "1"
        run: bash scripts/local-compose-fresh-data-check.sh

  openapi-validation:
    name: OpenAPI validation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      github.base_ref == 'main' ||
      github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Validate OpenAPI YAML
        run: node scripts/validate-openapi.mjs docs/api/openapi.yaml

      - name: Check Contracts/runtime/OpenAPI drift
        run: node scripts/check-contract-drift.mjs

      - name: Check mail request field inventory (Contracts/OpenAPI/SDK)
        run: |
          node scripts/check-mail-request-field-inventory.mjs
          node scripts/check-mail-request-field-inventory.mjs --self-test

      - name: Check implementation status manifest
        run: |
          node scripts/check-implementation-status.mjs
          node scripts/check-implementation-status.mjs --self-test

      - name: Self-test NuGet vulnerability audit script
        run: node scripts/nuget-vulnerability-audit.mjs --self-test

      - name: Check release smoke default tag drift
        run: node scripts/check-release-smoke-tag-drift.mjs

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Verify payload_hash examples (Python)
        run: |
          python examples/payload-hash/python/verify_vectors.py
          python examples/payload-hash/python/verify_request_vectors.py

      - name: Verify payload_hash examples (JavaScript)
        run: node examples/payload-hash/javascript/verify_vectors.mjs

      - name: Verify payload_hash examples (Go)
        working-directory: examples/payload-hash/go
        run: go test ./...
