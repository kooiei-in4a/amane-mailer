name: Promote Qualified OCI

# Digest-preserving promotion of a qualified Easy Setup OCI layout (P-OCI-PROMOTE).
# Does NOT rebuild images. Does NOT attach registry attestation.
# Intended for v1.2.0 EXTERNAL_PROVENANCE releases after #456 Go.
# Consumes the OCI layout artifact from a single #455 workflow run (SINGLE_WF_RUN_OPTION_A).
# Immutable handoff identity: candidate_workflow_run_id + candidate_artifact_id (+ artifact name check).

on:
  workflow_dispatch:
    inputs:
      candidate_workflow_run_id:
        description: GitHub Actions run ID of Generate Setup Release Candidate (#455)
        required: true
        type: string
      candidate_artifact_id:
        description: Exact Actions artifact ID of setup-release-candidate-oci from that run
        required: true
        type: string
      oci_layout_artifact:
        description: Artifact name from the candidate run (must match artifact ID)
        required: true
        type: string
        default: setup-release-candidate-oci
      expected_oci_index_digest:
        description: Expected source index digest (sha256:<64 lowercase hex>)
        required: true
        type: string
      release_version:
        description: Release version major.minor.patch (e.g. 1.2.0, no leading v)
        required: true
        type: string
      release_commit_sha:
        description: Exact 40-hex releaseCommitSha
        required: true
        type: string
      expected_head_branch:
        description: Expected candidate run head branch (v1.2.0 default release/v1.2.0-rc)
        required: true
        type: string
        default: release/v1.2.0-rc

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: promote-qualified-oci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/amane-mailer
  ATTEST_MODE: EXTERNAL_PROVENANCE
  CANDIDATE_WORKFLOW_NAME: Generate Setup Release Candidate
  CANDIDATE_WORKFLOW_PATH: .github/workflows/generate-setup-release-candidate.yml

jobs:
  promote:
    name: Promote OCI layout without rebuild
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate inputs and candidate workflow run
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_oci_index_digest }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_workflow_run_id }}
          OCI_ARTIFACT_NAME: ${{ inputs.oci_layout_artifact }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          EXPECTED_HEAD_BRANCH: ${{ inputs.expected_head_branch }}
        run: |
          set -Eeuo pipefail
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::release_version must be major.minor.patch"; exit 1; }
          [[ "${RELEASE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::release_commit_sha must be 40 lowercase hex"; exit 1; }
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { echo "::error::expected_oci_index_digest must be sha256:<64 lowercase hex>"; exit 1; }
          [[ "${CANDIDATE_RUN_ID}" =~ ^[0-9]+$ ]] \
            || { echo "::error::candidate_workflow_run_id must be numeric"; exit 1; }
          [[ "${CANDIDATE_ARTIFACT_ID}" =~ ^[0-9]+$ ]] \
            || { echo "::error::candidate_artifact_id must be numeric"; exit 1; }
          [[ -n "${OCI_ARTIFACT_NAME}" ]] \
            || { echo "::error::oci_layout_artifact is required"; exit 1; }
          if [[ "${RELEASE_VERSION}" == "1.2.0" ]]; then
            [[ "${EXPECTED_HEAD_BRANCH}" == "release/v1.2.0-rc" ]] \
              || { echo "::error::v1.2.0 expected_head_branch must be release/v1.2.0-rc"; exit 1; }
            echo "[info] v1.2.0 promote path selected (P-OCI-PROMOTE / SINGLE_WF_RUN_OPTION_A / EXTERNAL_PROVENANCE)"
          fi
          bash scripts/validate-candidate-oci-run.sh

      - name: Download OCI layout artifact from candidate run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: artifacts/promote-oci
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_workflow_run_id }}

      - name: Locate OCI layout directory
        id: layout
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f artifacts/promote-oci/oci-layout ]]; then
            echo "path=artifacts/promote-oci" >> "$GITHUB_OUTPUT"
          elif [[ -f artifacts/promote-oci/oci/oci-layout ]]; then
            echo "path=artifacts/promote-oci/oci" >> "$GITHUB_OUTPUT"
          elif [[ -f artifacts/promote-oci/setup-release-candidate-oci/oci/oci-layout ]]; then
            # download-artifact may keep the uploaded artifact folder name
            echo "path=artifacts/promote-oci/setup-release-candidate-oci/oci" >> "$GITHUB_OUTPUT"
          else
            echo "::error::OCI layout (oci-layout) not found in artifact"
            find artifacts/promote-oci -maxdepth 4 -type f | head -n 80
            exit 1
          fi

      - name: Install pinned crane
        id: crane
        shell: bash
        run: |
          set -Eeuo pipefail
          pin_dir="${RUNNER_TEMP}/pinned-crane"
          bash scripts/install-pinned-crane.sh "${pin_dir}"
          echo "bin=${pin_dir}/crane" >> "$GITHUB_OUTPUT"
          "${pin_dir}/crane" version

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote without rebuild
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_oci_index_digest }}
          LAYOUT_PATH: ${{ steps.layout.outputs.path }}
          CRANE_BIN: ${{ steps.crane.outputs.bin }}
        run: |
          set -Eeuo pipefail
          bash scripts/promote-candidate-oci.sh \
            --oci-layout "${LAYOUT_PATH}" \
            --expected-digest "${EXPECTED_DIGEST}" \
            --repository "${IMAGE_REPOSITORY}" \
            --release-version "${RELEASE_VERSION}" \
            --release-commit-sha "${RELEASE_COMMIT_SHA}" \
            --version-tag "v${RELEASE_VERSION}" \
            --sha-tag "sha-${RELEASE_COMMIT_SHA}" \
            --attest-mode "${ATTEST_MODE}" \
            --crane "${CRANE_BIN}"
