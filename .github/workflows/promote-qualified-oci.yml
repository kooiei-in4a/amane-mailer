name: Promote Qualified OCI

# Digest-preserving promotion of a qualified Easy Setup OCI layout (P-OCI-PROMOTE).
# Does NOT rebuild images. Does NOT attach registry attestation.
# Canonical, version-independent promotion path for qualified releases.
# Consumes the OCI layout and handoff artifacts from one candidate workflow run
# and a separate sealed qualification handoff. It never rebuilds an image.
# Immutable handoff identity includes candidate run/artifact/run-attempt,
# candidateId, qualificationRunId, releaseCommitSha, and OCI index digest.

on:
  workflow_dispatch:
    inputs:
      candidate_workflow_run_id:
        description: GitHub Actions run ID of Generate Setup Release Candidate (#455)
        required: true
        type: string
      candidate_artifact_id:
        description: Exact Actions artifact ID of setup-release-candidate-oci from that run
        required: true
        type: string
      candidate_workflow_run_attempt:
        description: Exact candidate workflow run attempt recorded in provenance
        required: true
        type: string
      candidate_handoff_artifact_id:
        description: Exact Actions artifact ID of setup-release-candidate-handoff from that run
        required: true
        type: string
      oci_layout_artifact:
        description: Artifact name from the candidate run (must match artifact ID)
        required: true
        type: string
        default: setup-release-candidate-oci
      oci_handoff_artifact:
        description: Handoff artifact name from the candidate run (must match artifact ID)
        required: true
        type: string
        default: setup-release-candidate-handoff
      expected_oci_index_digest:
        description: Expected source index digest (sha256:<64 lowercase hex>)
        required: true
        type: string
      release_version:
        description: Release version major.minor.patch (e.g. 1.2.0, no leading v)
        required: true
        type: string
      release_commit_sha:
        description: Exact 40-hex releaseCommitSha
        required: true
        type: string
      expected_head_branch:
        description: Expected candidate run head branch (must match the qualified run)
        required: true
        type: string
      candidate_id:
        description: CandidateId from the sealed qualification binding
        required: true
        type: string
      qualification_run_id:
        description: QualificationRunId from the sealed qualification binding
        required: true
        type: string
      qualification_workflow_run_id:
        description: Actions run ID containing the sealed qualification handoff artifact
        required: true
        type: string
      qualification_artifact_id:
        description: Exact Actions artifact ID containing binding, decision, and sealed event
        required: true
        type: string
      qualification_artifact_name:
        description: Qualification handoff artifact name (must match artifact ID)
        required: true
        type: string
        default: qualification-handoff

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: promote-qualified-oci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/amane-mailer
  ATTEST_MODE: EXTERNAL_PROVENANCE
  CANDIDATE_WORKFLOW_NAME: Generate Setup Release Candidate
  CANDIDATE_WORKFLOW_PATH: .github/workflows/generate-setup-release-candidate.yml

jobs:
  promote:
    name: Promote OCI layout without rebuild
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate inputs and candidate workflow run
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_oci_index_digest }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_workflow_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.candidate_workflow_run_attempt }}
          OCI_ARTIFACT_NAME: ${{ inputs.oci_layout_artifact }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_HANDOFF_ARTIFACT_NAME: ${{ inputs.oci_handoff_artifact }}
          CANDIDATE_HANDOFF_ARTIFACT_ID: ${{ inputs.candidate_handoff_artifact_id }}
          EXPECTED_HEAD_BRANCH: ${{ inputs.expected_head_branch }}
          QUALIFICATION_WORKFLOW_RUN_ID: ${{ inputs.qualification_workflow_run_id }}
          QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          QUALIFICATION_ARTIFACT_NAME: ${{ inputs.qualification_artifact_name }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          set -Eeuo pipefail
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::release_version must be major.minor.patch"; exit 1; }
          [[ "${RELEASE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::release_commit_sha must be 40 lowercase hex"; exit 1; }
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { echo "::error::expected_oci_index_digest must be sha256:<64 lowercase hex>"; exit 1; }
          [[ "${CANDIDATE_RUN_ID}" =~ ^[0-9]+$ ]] \
            || { echo "::error::candidate_workflow_run_id must be numeric"; exit 1; }
          [[ "${EXPECTED_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::candidate_workflow_run_attempt must be a positive integer"; exit 1; }
          [[ "${CANDIDATE_ARTIFACT_ID}" =~ ^[0-9]+$ ]] \
            || { echo "::error::candidate_artifact_id must be numeric"; exit 1; }
          [[ "${CANDIDATE_HANDOFF_ARTIFACT_ID}" =~ ^[0-9]+$ ]] \
            || { echo "::error::candidate_handoff_artifact_id must be numeric"; exit 1; }
          [[ "${QUALIFICATION_WORKFLOW_RUN_ID}" =~ ^[0-9]+$ ]] \
            || { echo "::error::qualification_workflow_run_id must be numeric"; exit 1; }
          [[ "${QUALIFICATION_ARTIFACT_ID}" =~ ^[0-9]+$ ]] \
            || { echo "::error::qualification_artifact_id must be numeric"; exit 1; }
          [[ -n "${QUALIFICATION_ARTIFACT_NAME}" ]] \
            || { echo "::error::qualification_artifact_name is required"; exit 1; }
          [[ -n "${CANDIDATE_ID}" && -n "${QUALIFICATION_RUN_ID}" ]] \
            || { echo "::error::candidate_id and qualification_run_id are required"; exit 1; }
          [[ -n "${OCI_ARTIFACT_NAME}" ]] \
            || { echo "::error::oci_layout_artifact is required"; exit 1; }
          [[ -n "${EXPECTED_HEAD_BRANCH}" ]] || { echo "::error::expected_head_branch is required"; exit 1; }
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] \
            || { echo "::error::canonical promotion must be dispatched from refs/heads/main"; exit 1; }
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/promote-qualified-oci.yml@refs/heads/main"
          [[ "${GITHUB_WORKFLOW_REF}" == "${expected_workflow_ref}" ]] \
            || { echo "::error::canonical promotion workflow identity mismatch"; exit 1; }
          bash scripts/validate-candidate-oci-run.sh

      - name: Validate qualification handoff identity
        id: qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_WORKFLOW_RUN_ID: ${{ inputs.qualification_workflow_run_id }}
          QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          QUALIFICATION_ARTIFACT_NAME: ${{ inputs.qualification_artifact_name }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_WORKFLOW_RUN_ID}")"
          RUN_JSON="${run_json}" python3 - <<'PY'
          import json, os, sys
          run = json.loads(os.environ["RUN_JSON"])
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("qualification workflow run is not completed successfully")
          PY
          arts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_WORKFLOW_RUN_ID}/artifacts" --paginate)"
          ARTS_JSON="${arts_json}" ARTIFACT_NAME="${QUALIFICATION_ARTIFACT_NAME}" ARTIFACT_ID="${QUALIFICATION_ARTIFACT_ID}" python3 - <<'PY'
          import json, os, sys
          arts = json.loads(os.environ["ARTS_JSON"]).get("artifacts") or []
          name = os.environ["ARTIFACT_NAME"]
          wanted = os.environ["ARTIFACT_ID"]
          matches = [a for a in arts if a.get("name") == name]
          if len(matches) != 1:
              raise SystemExit("qualification artifact name is missing or ambiguous")
          art = matches[0]
          if art.get("expired") is True or str(art.get("id")) != wanted:
              raise SystemExit("qualification artifact identity mismatch or expired")
          PY
          echo "qualification_artifact_id=${QUALIFICATION_ARTIFACT_ID}" >> "$GITHUB_OUTPUT"

      - name: Download OCI layout artifact from candidate run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: artifacts/promote-oci
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_workflow_run_id }}

      - name: Download candidate handoff artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_handoff_artifact_id }}
          path: artifacts/promote-handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_workflow_run_id }}

      - name: Download sealed qualification handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.qualification_artifact_id }}
          merge-multiple: true
          path: artifacts/qualification
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_workflow_run_id }}

      - name: Locate OCI layout directory
        id: layout
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f artifacts/promote-oci/oci-layout ]]; then
            echo "path=artifacts/promote-oci" >> "$GITHUB_OUTPUT"
          elif [[ -f artifacts/promote-oci/oci/oci-layout ]]; then
            echo "path=artifacts/promote-oci/oci" >> "$GITHUB_OUTPUT"
          elif [[ -f artifacts/promote-oci/setup-release-candidate-oci/oci/oci-layout ]]; then
            # download-artifact may keep the uploaded artifact folder name
            echo "path=artifacts/promote-oci/setup-release-candidate-oci/oci" >> "$GITHUB_OUTPUT"
          else
            echo "::error::OCI layout (oci-layout) not found in artifact"
            find artifacts/promote-oci -maxdepth 4 -type f | head -n 80
            exit 1
          fi

      - name: Locate candidate handoff directory
        id: handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t matches < <(find artifacts/promote-handoff -type f -name candidate-provenance.json -print)
          if [[ "${#matches[@]}" -ne 1 ]]; then
            echo "::error::candidate provenance must resolve to exactly one file"
            exit 1
          fi
          echo "path=$(dirname "${matches[0]}")" >> "$GITHUB_OUTPUT"

      - name: Validate candidate handoff identity before registry login
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_oci_index_digest }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_workflow_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_workflow_run_attempt }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          OCI_ROOT: ${{ steps.layout.outputs.path }}
          HANDOFF_ROOT: ${{ steps.handoff.outputs.path }}
        run: |
          set -Eeuo pipefail
          bash scripts/validate-candidate-oci-handoff.sh \
            --oci-root "${OCI_ROOT}" \
            --handoff-root "${HANDOFF_ROOT}" \
            --expected-digest "${EXPECTED_DIGEST}" \
            --release-version "${RELEASE_VERSION}" \
            --release-commit-sha "${RELEASE_COMMIT_SHA}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --candidate-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --candidate-id "${CANDIDATE_ID}" \
            --repository "${IMAGE_REPOSITORY}"

      - name: Validate sealed qualification before registry login
        env:
          QUALIFICATION_ROOT: ${{ github.workspace }}/artifacts/qualification
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_oci_index_digest }}
        run: |
          set -Eeuo pipefail
          bash scripts/validate-qualification-handoff.sh \
            --root "${QUALIFICATION_ROOT}" \
            --candidate-id "${CANDIDATE_ID}" \
            --qualification-run-id "${QUALIFICATION_RUN_ID}" \
            --release-commit-sha "${RELEASE_COMMIT_SHA}" \
            --expected-digest "${EXPECTED_DIGEST}"

      - name: Install pinned crane
        id: crane
        shell: bash
        run: |
          set -Eeuo pipefail
          pin_dir="${RUNNER_TEMP}/pinned-crane"
          bash scripts/install-pinned-crane.sh "${pin_dir}"
          echo "bin=${pin_dir}/crane" >> "$GITHUB_OUTPUT"
          "${pin_dir}/crane" version

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote without rebuild
        id: promote
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_oci_index_digest }}
          LAYOUT_PATH: ${{ steps.layout.outputs.path }}
          CRANE_BIN: ${{ steps.crane.outputs.bin }}
        run: |
          set -Eeuo pipefail
          bash scripts/promote-candidate-oci.sh \
            --oci-layout "${LAYOUT_PATH}" \
            --expected-digest "${EXPECTED_DIGEST}" \
            --repository "${IMAGE_REPOSITORY}" \
            --release-version "${RELEASE_VERSION}" \
            --release-commit-sha "${RELEASE_COMMIT_SHA}" \
            --version-tag "v${RELEASE_VERSION}" \
            --sha-tag "sha-${RELEASE_COMMIT_SHA}" \
            --attest-mode "${ATTEST_MODE}" \
            --crane "${CRANE_BIN}"

      - name: Write promote proof from runtime values
        shell: bash
        env:
          CRANE_BIN: ${{ steps.crane.outputs.bin }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          EXPECTED_DIGEST: ${{ inputs.expected_oci_index_digest }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_workflow_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_workflow_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.oci_layout_artifact }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
          QUALIFICATION_ARTIFACT_NAME: ${{ inputs.qualification_artifact_name }}
          PROMOTION_WORKFLOW_REF: ${{ github.workflow_ref }}
          PROMOTION_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          version_digest="$("${CRANE_BIN}" digest "${IMAGE_REPOSITORY}:v${RELEASE_VERSION}")"
          sha_digest="$("${CRANE_BIN}" digest "${IMAGE_REPOSITORY}:sha-${RELEASE_COMMIT_SHA}")"
          [[ "${version_digest}" == "${EXPECTED_DIGEST}" && "${sha_digest}" == "${EXPECTED_DIGEST}" ]] \
            || { echo "::error::destination digest does not preserve expected OCI digest"; exit 1; }
          mkdir -p artifacts/promote-proof
          PROOF_PATH="${GITHUB_WORKSPACE}/artifacts/promote-proof/promote-proof.json" \
          python3 - <<'PY'
          import json, os
          proof = {
              "schemaVersion": 1,
              "publishMethod": "P-OCI-PROMOTE",
              "attestMode": "EXTERNAL_PROVENANCE",
              "repository": os.environ["IMAGE_REPOSITORY"],
              "releaseVersion": os.environ["RELEASE_VERSION"],
              "releaseCommitSha": os.environ["RELEASE_COMMIT_SHA"],
              "sourceOciIndexDigest": os.environ["EXPECTED_DIGEST"],
              "destinationOciIndexDigest": os.environ["EXPECTED_DIGEST"],
              "versionTag": "v" + os.environ["RELEASE_VERSION"],
              "shaTag": "sha-" + os.environ["RELEASE_COMMIT_SHA"],
              "candidateWorkflowRunId": os.environ["CANDIDATE_RUN_ID"],
              "candidateWorkflowRunAttempt": os.environ["CANDIDATE_RUN_ATTEMPT"],
              "candidateArtifactId": os.environ["CANDIDATE_ARTIFACT_ID"],
              "candidateArtifactName": os.environ["CANDIDATE_ARTIFACT_NAME"],
              "candidateId": os.environ["CANDIDATE_ID"],
              "qualificationRunId": os.environ["QUALIFICATION_RUN_ID"],
              "qualificationArtifactId": os.environ["QUALIFICATION_ARTIFACT_ID"],
              "qualificationArtifactName": os.environ["QUALIFICATION_ARTIFACT_NAME"],
              "promotionWorkflowRef": os.environ["PROMOTION_WORKFLOW_REF"],
              "promotionWorkflowSha": os.environ["PROMOTION_WORKFLOW_SHA"],
          }
          with open(os.environ["PROOF_PATH"], "w", encoding="utf-8") as f:
              json.dump(proof, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

      - name: Upload promote proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promote-proof
          path: artifacts/promote-proof/promote-proof.json
          if-no-files-found: error
          retention-days: 90
