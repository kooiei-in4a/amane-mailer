name: Publish Amane Mailer Image (retired)

# Fail-closed tombstone for the legacy rebuild-and-push route.
#
# Product images are published only by promote-qualified-oci.yml, which
# promotes a sealed, qualified OCI layout without rebuilding it. Keep this
# workflow until the operational references have been migrated and deletion is
# approved separately.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Legacy rebuild publish retired
    runs-on: ubuntu-24.04
    steps:
      - name: Stop before registry or build
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::error::publish-image.yml is a fail-closed tombstone."
          echo "::error::The legacy rebuild/push/tag route is retired because it cannot preserve the digest of the qualified OCI candidate."
          echo "::error::Use .github/workflows/promote-qualified-oci.yml (P-OCI-PROMOTE) after sealed qualification and identity validation."
          exit 1
