name: Publish Amane Mailer Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/amane-mailer
  IMAGE_PLATFORMS: linux/amd64,linux/arm64
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      digest: ${{ steps.metadata.outputs.digest }}
      platform: ${{ steps.metadata.outputs.platform }}
      attestation_manifest: ${{ steps.metadata.outputs.attestation_manifest }}
      release_tag: ${{ steps.image.outputs.release_tag }}
      revision: ${{ steps.image.outputs.revision }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Publish must run from a release tag ref, not ${GITHUB_REF_TYPE}."
            exit 1
          fi

          release_tag="${GITHUB_REF_NAME}"
          if ! [[ "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z-]*(\.[0-9A-Za-z][0-9A-Za-z-]*)*)?$ ]]; then
            echo "::error::Release tag must look like v0.1.0 or v0.1.0-rc.1: ${release_tag}"
            exit 1
          fi

          revision="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${release_tag}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"

          if [ "${revision}" != "${tag_commit}" ]; then
            echo "::error::Checked-out commit ${revision} does not match ${release_tag} commit ${tag_commit}."
            exit 1
          fi

          if [ "${revision}" != "${event_commit}" ]; then
            echo "::error::Checked-out commit ${revision} does not match workflow event commit ${event_commit}."
            exit 1
          fi

          package_version="${release_tag#v}"

          # v1.2.0 must use digest-preserving P-OCI-PROMOTE (promote-qualified-oci.yml).
          # This rebuild-and-push path cannot guarantee candidate/public OCI index identity.
          if [ "${package_version}" = "1.2.0" ] || [ "${release_tag}" = "v1.2.0" ]; then
            echo "::error::v1.2.0 image publish must use P-OCI-PROMOTE (promote-qualified-oci.yml), not publish-image.yml rebuild."
            exit 1
          fi

          tags="${IMAGE_NAME}:sha-${revision}"
          tags="${tags}"$'\n'"${IMAGE_NAME}:${release_tag}"

          {
            echo "release_tag=${release_tag}"
            echo "revision=${revision}"
            echo "sha_tag=sha-${revision}"
            echo "package_version=${package_version}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Validate release artifact versions
        env:
          PACKAGE_VERSION: ${{ steps.image.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail

          contracts_version="$(dotnet msbuild src/Amane.Mailer.Contracts/Amane.Mailer.Contracts.csproj -getProperty:Version)"
          contracts_version="${contracts_version//$'\r'/}"
          if [ "${contracts_version}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Contracts Version ${contracts_version} must match release tag package version ${PACKAGE_VERSION}."
            exit 1
          fi

          openapi_version="$(grep -E '^  version:' docs/api/openapi.yaml | head -n 1 | sed -E 's/^  version: "([^"]+)".*/\1/')"
          if [ "${openapi_version}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::OpenAPI info.version ${openapi_version} must match release tag package version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Restore
        run: dotnet restore Amane.Mailer.slnx --locked-mode

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Audit NuGet vulnerabilities
        run: node scripts/nuget-vulnerability-audit.mjs --skip-restore

      - name: Build
        run: dotnet build Amane.Mailer.slnx -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test Amane.Mailer.slnx -c ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Validate OpenAPI and contract drift
        run: |
          node scripts/validate-openapi.mjs docs/api/openapi.yaml
          node scripts/check-contract-drift.mjs
          node scripts/check-mail-request-field-inventory.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure image tags are unpublished
        env:
          SHA_IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.sha_tag }}
          VERSION_IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          for image_ref in "${SHA_IMAGE_REF}" "${VERSION_IMAGE_REF}"; do
            if inspect_output="$(docker buildx imagetools inspect "$image_ref" 2>&1)"; then
              echo "::error::Image tag already exists and will not be overwritten: ${image_ref}"
              printf '%s\n' "$inspect_output"
              exit 1
            fi

            if ! printf '%s\n' "$inspect_output" | grep -Eiq 'not found|manifest unknown|name unknown'; then
              echo "::error::Could not confirm image tag is absent: ${image_ref}"
              printf '%s\n' "$inspect_output"
              exit 1
            fi
          done

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.release_tag }}
            org.opencontainers.image.description=Amane Mailer runtime image

      - name: Verify published image metadata
        id: metadata
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.sha_tag }}
          VERSION_REF: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.release_tag }}
          IMAGE_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
          RELEASE_TAG: ${{ steps.image.outputs.release_tag }}
          REVISION: ${{ steps.image.outputs.revision }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/verify-published-image.sh
