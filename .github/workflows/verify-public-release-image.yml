name: Verify Public Release Image

# Read-only verification path for an already-published image. This exists for
# a publication whose publish job succeeded but whose post-publish verifier
# could not complete, without rebuilding or touching any existing registry tag.

on:
  workflow_dispatch:
    inputs:
      publication_run_id:
        description: Publish workflow run ID that owns the publication input artifact
        required: true
        type: string
      publication_source_sha:
        description: Source SHA recorded by the publish workflow
        required: true
        type: string
      release_version:
        description: Published image version (major.minor.patch)
        required: true
        type: string
      expected_digest:
        description: Published image digest (sha256:<64 lowercase hex>)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-public-release-image-${{ inputs.publication_run_id }}-${{ inputs.publication_source_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.publication_source_sha }}
  MAILER_VERSION: ${{ inputs.release_version }}
  EXPECTED_DIGEST: ${{ inputs.expected_digest }}
  PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
  PUBLISH_REPOSITORY: ghcr.io/${{ github.repository_owner }}/amane-mailer
  REPORT_DIR: artifacts/publish-release-image

jobs:
  verify-public-image:
    name: Verify existing public linux/amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require canonical main workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] \
            || { echo '::error::verification must be dispatched from refs/heads/main'; exit 1; }
          expected_ref="${GITHUB_REPOSITORY}/.github/workflows/verify-public-release-image.yml@refs/heads/main"
          [[ "${GITHUB_WORKFLOW_REF}" == "${expected_ref}" ]] \
            || { echo '::error::workflow identity mismatch'; exit 1; }

      - name: Validate verification inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${PUBLICATION_RUN_ID}" =~ ^[0-9]+$ ]] \
            || { echo '::error::publication_run_id must be numeric'; exit 1; }
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::publication_source_sha must be a lowercase 40-hex SHA'; exit 1; }
          [[ "${MAILER_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo '::error::release_version must be major.minor.patch'; exit 1; }
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { echo '::error::expected_digest must be sha256:<64 lowercase hex>'; exit 1; }

      - name: Checkout verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify-only workflow contract self-test
        run: bash scripts/verify-public-release-image-workflow-self-test.sh

      - name: Download publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-release-image-${{ inputs.publication_source_sha }}
          path: artifacts/publish-release-image
          repository: ${{ github.repository }}
          run-id: ${{ inputs.publication_run_id }}
          github-token: ${{ github.token }}

      - name: Bind publication inputs from artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          identity_count="$(find artifacts/publish-release-image -type f -name identity.json -print | wc -l)"
          build_count="$(find artifacts/publish-release-image -type f -name report.json -not -path '*/reproducibility/*' -print | wc -l)"
          repro_count="$(find artifacts/publish-release-image -type f -path '*/reproducibility/report.json' -print | wc -l)"
          [[ "${identity_count}" == "1" && "${build_count}" == "1" && "${repro_count}" == "1" ]] \
            || { echo '::error::publication inputs are missing or ambiguous'; find artifacts/publish-release-image -type f -print; exit 1; }

          identity_file="$(find artifacts/publish-release-image -type f -name identity.json -print)"
          build_report="$(find artifacts/publish-release-image -type f -name report.json -not -path '*/reproducibility/*' -print)"
          repro_report="$(find artifacts/publish-release-image -type f -path '*/reproducibility/report.json' -print)"
          identity_source_sha="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["sourceCommitSha"])' "${identity_file}")"
          identity_version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseVersion"])' "${identity_file}")"
          identity_digest="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["image"]["digest"])' "${identity_file}")"
          [[ "${identity_source_sha}" == "${SOURCE_SHA}" ]] \
            || { echo '::error::artifact source SHA does not match publication_source_sha'; exit 1; }
          [[ "${identity_version}" == "${MAILER_VERSION}" ]] \
            || { echo '::error::artifact release version does not match release_version'; exit 1; }
          [[ "${identity_digest}" == "${EXPECTED_DIGEST}" ]] \
            || { echo '::error::artifact digest does not match expected_digest'; exit 1; }

          {
            echo "IDENTITY_FILE=${identity_file}"
            echo "BUILD_REPORT=${build_report}"
            echo "REPRO_REPORT=${repro_report}"
          } >> "${GITHUB_ENV}"

      - name: Install pinned crane
        shell: bash
        run: |
          set -Eeuo pipefail
          pin_dir="${RUNNER_TEMP}/pinned-crane"
          bash scripts/install-pinned-crane.sh "${pin_dir}"
          echo "CRANE_BIN=${pin_dir}/crane" >> "${GITHUB_ENV}"

      - name: Static public consumer verification self-test
        run: bash scripts/verify-published-release-image-self-test.sh

      - name: Verify public image by published digest
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/verify-published-release-image.sh \
            --repository "${PUBLISH_REPOSITORY}" \
            --expected-digest "${EXPECTED_DIGEST}" \
            --release-version "${MAILER_VERSION}" \
            --release-commit-sha "${SOURCE_SHA}" \
            --crane "${CRANE_BIN}" \
            --report-file "${REPORT_DIR}/public-consumer-verification.json" \
            --evidence-file "${REPORT_DIR}/release-publication-evidence.json" \
            --identity-file "${IDENTITY_FILE}" \
            --build-report "${BUILD_REPORT}" \
            --reproducibility-report "${REPRO_REPORT}"

      - name: Upload release publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-release-image-evidence-${{ inputs.publication_source_sha }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/publish-release-image/public-consumer-verification.json
            artifacts/publish-release-image/release-publication-evidence.json

      - name: Write public verification summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '## Published public image verification'
            echo
            if [[ -f "${REPORT_DIR}/release-publication-evidence.json" ]]; then
              echo '```json'
              cat "${REPORT_DIR}/release-publication-evidence.json"
              echo '```'
            else
              echo 'Publication evidence was not produced.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
