openapi: 3.1.0
info:
  title: Amane Mailer Service API
  version: "0.9.1"
  description: >-
    汎用メール送信マイクロサービス。送信依頼を受け付けて永続化し、
    バックグラウンド Worker が ACS (Azure Communication Services) または Mailpit
    経由で非同期に配送する。利用側（App）が本文を組み立て、本サービスは「配送専用」。

    - 認証: テナント単位の Bearer トークン
    - 冪等性: (tenant_id, source_service, mail_request_id) の一意制約。再送は 202 already_accepted、
      同一IDで内容差異は 409。
    - 実配送の一意性: HTTP 受付の冪等性とは別契約。実メール配送は exactly-once ではなく
      at-least-once（ACS は決定論的 operation id による緩和のみ、Mailpit は冪等性なし）。
      詳細は docs/service-spec.md の「配送一意性（実送信の保証）」節を参照。
    - 本文/宛先/件名は利用側が組み立て、payload に載せて渡す（テンプレートは持たない）。
    - 配送結果 Webhook: テナント設定で HTTPS エンドポイントを登録すると、
      `delivered` / `failed` / `dead_lettered` / `cancelled` 時に
      `MailDeliveryEventPayload` を HMAC 署名付き POST で Push する。
      検証手順は docs/consumer/webhook-verification.md を参照。
  contact:
    name: Amane Mailer
servers:
  - url: http://mailer:8080
    description: コンテナ内部ネットワーク（internal）からの呼び出し

tags:
  - name: mail-requests
    description: 送信依頼の受付
  - name: delivery-webhooks
    description: 配送結果 Webhook（Mailer → Consumer への outbound POST）
  - name: health
    description: ヘルス/レディネス

paths:
  /internal/mail-requests:
    post:
      tags: [mail-requests]
      summary: メール送信依頼を受け付ける
      description: >-
        送信依頼を Mailer DB に永続化し 202 を返す（ACS 送信完了ではない）。
        実際の送信は Worker が非同期に行う。リクエストボディ上限は 256,000 バイト。
        202 は受付の成功のみを表し、実メール配送の exactly-once は保証しない
        （at-least-once。詳細は docs/service-spec.md の「配送一意性（実送信の保証）」節）。
      operationId: createMailRequest
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailRequestCreateRequest'
      responses:
        '202':
          description: 受付済み（初回 accepted / 再送 already_accepted）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRequestCreateResponse'
        '400':
          description: ボディが不正な JSON、または空
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid:
                  value: { code: INVALID_REQUEST, message: "Request body is not valid JSON." }
        '401':
          description: テナント/トークン不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unauthorized: { value: { code: UNAUTHORIZED_TENANT } }
        '403':
          description: source_service がテナントの許可リスト外
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                forbidden: { value: { code: SOURCE_SERVICE_NOT_ALLOWED } }
        '409':
          description: 同一 mail_request_id で payload_hash が異なる（冪等性衝突）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                conflict: { value: { code: IDEMPOTENCY_CONFLICT } }
        '413':
          description: リクエストボディが上限（256,000 バイト）超過
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tooLarge: { value: { code: REQUEST_TOO_LARGE } }
        '422':
          description: バリデーション失敗
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tooManyRecipients: { value: { code: TOO_MANY_RECIPIENTS } }
                invalidMetadata: { value: { code: INVALID_METADATA } }
                invalidPayloadHash: { value: { code: INVALID_PAYLOAD_HASH } }
                invalidRecipient: { value: { code: INVALID_REQUEST, message: "A valid recipient is required." } }
                scheduledAtInPast: { value: { code: SCHEDULED_AT_IN_PAST } }
                scheduledAtTooFar: { value: { code: SCHEDULED_AT_TOO_FAR } }
        '503':
          description: >-
            DB 障害等。busy/locked 等の一過性障害は `MAILER_TEMPORARILY_UNAVAILABLE`
            (retryable=true)。SQLITE_FULL（disk 枯渇）は `STORAGE_FULL`（retryable=false）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unavailable: { value: { code: MAILER_TEMPORARILY_UNAVAILABLE, retryable: true } }
                storageFull: { value: { code: STORAGE_FULL, retryable: false } }

  /internal/mail-requests/{mail_request_id}/cancel:
    post:
      tags: [mail-requests]
      summary: 送信前のメール依頼をキャンセルする
      description: >-
        `queued` かつ未 claim（送信前）の依頼のみキャンセルできる。
        成功時は `cancelled` ステータスを返す。既に `cancelled` の同一キーへの再 cancel は冪等に 200 を返す。
        active `processing` / `delivered` 等は 422 INVALID_STATE。
        webhook enqueue は best-effort（失敗しても cancel HTTP 成功を崩さない。欠落は reconcile で補完し得る）。
        他 tenant の ID は存在有無を漏らさず 404。
      operationId: cancelMailRequest
      security:
        - tenantBearer: []
      parameters:
        - name: mail_request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: source_service
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{1,62}$'
      responses:
        '200':
          description: キャンセル後の配送ステータス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRequestStatusResponse'
        '400':
          description: mail_request_id / tenant_id / source_service が不正または欠落
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: テナント/トークン不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unauthorized: { value: { code: UNAUTHORIZED_TENANT } }
        '403':
          description: source_service がテナントの許可リスト外
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                forbidden: { value: { code: SOURCE_SERVICE_NOT_ALLOWED } }
        '404':
          description: 指定スコープ内に mail request が存在しない
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notFound: { value: { code: NOT_FOUND } }
        '422':
          description: 送信前キャンセルできない状態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidState: { value: { code: INVALID_STATE } }
        '503':
          description: >-
            DB 障害等。busy/locked 等の一過性障害は `MAILER_TEMPORARILY_UNAVAILABLE`
            (retryable=true)。SQLITE_FULL（disk 枯渇）は `STORAGE_FULL`（retryable=false）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unavailable: { value: { code: MAILER_TEMPORARILY_UNAVAILABLE, retryable: true } }
                storageFull: { value: { code: STORAGE_FULL, retryable: false } }

  /internal/mail-requests/{mail_request_id}/reschedule:
    post:
      tags: [mail-requests]
      summary: 予約送信時刻を変更する
      description: >-
        `queued` かつ `attempt_count = 0`（未送信）の依頼の `scheduled_at` を更新する。
        `null` を送るとスケジュールゲートを解除し即時配送対象になる。
        API 時刻は UTC。過去時刻は 422 SCHEDULED_AT_IN_PAST、最大予約期間（30 日）超過は 422 SCHEDULED_AT_TOO_FAR。
        `next_attempt_at`（再試行）とは独立。
      operationId: rescheduleMailRequest
      security:
        - tenantBearer: []
      parameters:
        - name: mail_request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: source_service
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{1,62}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailRequestRescheduleRequest'
      responses:
        '200':
          description: 再スケジュール後の配送ステータス
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRequestStatusResponse'
        '400':
          description: ボディまたはクエリが不正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: テナント/トークン不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unauthorized: { value: { code: UNAUTHORIZED_TENANT } }
        '403':
          description: source_service がテナントの許可リスト外
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                forbidden: { value: { code: SOURCE_SERVICE_NOT_ALLOWED } }
        '404':
          description: 指定スコープ内に mail request が存在しない
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notFound: { value: { code: NOT_FOUND } }
        '422':
          description: バリデーション失敗または再スケジュールできない状態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                scheduledAtInPast: { value: { code: SCHEDULED_AT_IN_PAST } }
                scheduledAtTooFar: { value: { code: SCHEDULED_AT_TOO_FAR } }
                invalidState: { value: { code: INVALID_STATE } }
        '413':
          description: リクエストボディが上限（256,000 バイト）超過
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                tooLarge: { value: { code: REQUEST_TOO_LARGE } }
        '503':
          description: >-
            DB 障害等。busy/locked 等の一過性障害は `MAILER_TEMPORARILY_UNAVAILABLE`
            (retryable=true)。SQLITE_FULL（disk 枯渇）は `STORAGE_FULL`（retryable=false）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unavailable: { value: { code: MAILER_TEMPORARILY_UNAVAILABLE, retryable: true } }
                storageFull: { value: { code: STORAGE_FULL, retryable: false } }

  /internal/mail-requests/{mail_request_id}:
    get:
      tags: [mail-requests]
      summary: メール送信依頼の配送ステータスを照会する
      description: >-
        指定 tenant / source_service スコープ内の mail request の Worker 配送ステータスを返す。
        存在しない ID および他 tenant の ID は存在有無を漏らさず 404 を返す。
        返却 JSON には recipient / subject / body 等の PII は含めない。
      operationId: getMailRequestStatus
      security:
        - tenantBearer: []
      parameters:
        - name: mail_request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 利用側生成の依頼 ID（POST 時と同じ値）。
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: 環境×プロダクト単位の識別子。Bearer トークンと対で認可される。
        - name: source_service
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9_-]{1,62}$'
          description: 呼び出し元サービス名。テナントの source_services 許可リストに含まれる必要がある。
      responses:
        '200':
          description: 配送ステータス（Worker 状態）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailRequestStatusResponse'
              examples:
                queued:
                  value:
                    mail_request_id: "018f7c2a-0000-7000-8000-000000000000"
                    status: queued
                    attempt_count: 0
                    max_attempts: 5
                    accepted_at: "2026-07-21T12:00:00Z"
                delivered:
                  value:
                    mail_request_id: "018f7c2a-0000-7000-8000-000000000001"
                    status: delivered
                    attempt_count: 1
                    max_attempts: 5
                    accepted_at: "2026-07-21T12:00:00Z"
                    delivered_at: "2026-07-21T12:05:00Z"
        '400':
          description: mail_request_id / tenant_id / source_service が不正または欠落
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid: { value: { code: INVALID_REQUEST, message: "mail_request_id must be a UUID." } }
        '401':
          description: テナント/トークン不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unauthorized: { value: { code: UNAUTHORIZED_TENANT } }
        '403':
          description: source_service がテナントの許可リスト外
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                forbidden: { value: { code: SOURCE_SERVICE_NOT_ALLOWED } }
        '404':
          description: 指定スコープ内に mail request が存在しない（他 tenant の ID も同様）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notFound: { value: { code: NOT_FOUND } }
        '503':
          description: >-
            DB 障害等。busy/locked 等の一過性障害は `MAILER_TEMPORARILY_UNAVAILABLE`
            (retryable=true)。SQLITE_FULL（disk 枯渇）は `STORAGE_FULL`（retryable=false）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unavailable: { value: { code: MAILER_TEMPORARILY_UNAVAILABLE, retryable: true } }
                storageFull: { value: { code: STORAGE_FULL, retryable: false } }

  /healthz:
    get:
      tags: [health]
      summary: 生存確認（liveness）
      operationId: healthz
      security: []
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy: { type: boolean, const: true }

  /readyz:
    get:
      tags: [health]
      summary: 受付可否（readiness、現行 migration schema + Worker/Sweep 稼働・heartbeat 鮮度）
      operationId: readyz
      security: []
      responses:
        '200':
          description: >-
            受付可能（現行バイナリが必要とする migration が applied かつ checksum 一致。
            Worker 有効時は Worker/Sweep 両サービス稼働中かつ
            heartbeat が Mailer:Healthcheck:MaxHeartbeatStalenessSeconds 以内）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean, const: true }
        '503':
          description: >-
            DB 未接続・現行 schema 未適用 / migration checksum 不一致、
            Worker/Sweep BackgroundService が停止中、
            または worker/sweep heartbeat が閾値を超えて古い
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean, const: false }

components:
  securitySchemes:
    tenantBearer:
      type: http
      scheme: bearer
      description: >-
        テナント単位の共有シークレット。トークンの実体はサーバー側環境変数
        （tenants.json の token_env が指す名前、例: MAIL_SERVICE_TOKEN_PRODUCTION）に格納。
        ボディの tenant_id とトークンの組が一致しなければ 401。

  schemas:
    MailRequestCreateRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - source_service
        - mail_request_id
        - purpose
        - to
        - subject
        - payload_hash
      properties:
        tenant_id:
          type: string
          format: uuid
          description: 環境×プロダクト単位の識別子。Bearer トークンと対で認可される。
        source_service:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,62}$'
          description: 呼び出し元サービス名。テナントの source_services 許可リストに含まれる必要がある。
          example: example-service
        mail_request_id:
          type: string
          format: uuid
          description: 利用側が生成する配送単位 ID。冪等キーの一部（推奨 UUIDv7）。
        purpose:
          type: string
          description: 用途識別（例 FormResponseNotification）。
          example: FormResponseNotification
        to:
          type: array
          description: 宛先。配列形は前方互換のため。MVP は最大 1 件（超過は 422 TOO_MANY_RECIPIENTS）。
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/MailRecipient'
        subject:
          type: string
          minLength: 1
        html_body:
          type: [string, "null"]
          description: html_body / text_body の少なくとも一方は必須。
        text_body:
          type: [string, "null"]
        reply_to:
          type: [string, "null"]
          format: email
        metadata:
          type: [object, "null"]
          additionalProperties:
            type: string
          description: >-
            付随情報。tenant の metadata_max_bytes（既定 4096）以内。
            キーに token / password / secret / url を含むものは拒否（422 INVALID_METADATA）。
            **値の内容は検査しない**（docs-first ポリシー）。送信された文字列がそのまま SQLite に永続化され、
            backup 対象となり、Admin 等の運用設定によっては画面に表示されうる。
            Consumer は secret、Bearer token、パスワード、リセット URL のクエリ secret 等を
            metadata 値に入れないこと。subject / body / reply_to と同様、metadata は PII や
            user-controlled データを含みうる。
        scheduled_at:
          type: [string, "null"]
          format: date-time
          description: >-
            初回配送予定時刻（UTC）。省略または null は即時配送。
            Worker / Sweep は scheduled_at 到来前に claim しない。
            next_attempt_at（再試行バックオフ）とは独立。
            過去時刻は 422 SCHEDULED_AT_IN_PAST、受付時刻から 30 日超は 422 SCHEDULED_AT_TOO_FAR。
            payload_hash 対象外（ルーティング / スケジュール envelope）。
        payload_hash:
          type: string
          description: >-
            配送ペイロードの SHA-256（hex）。サーバー側で再計算し不一致なら 422。
            同一 mail_request_id で hash が違えば 409。
            hash 対象は MailPayloadHashContract.IncludedFields と同じ
            source_service, purpose, to, subject, html_body, text_body,
            reply_to, metadata。tenant_id, mail_request_id, payload_hash, scheduled_at は
            routing / scheduling envelope / 自己参照のため除外する。
            計算手順: 対象フィールドのみ抽出する。任意フィールドは payload JSON に
            存在する場合だけ含め、明示的な null は null として含める。
            省略された任意フィールドは hash 対象外。キーをアルファベット昇順でソートし、スペースなし canonical JSON
            （MailPayloadHasher.BuildDeliveryPayloadJson() の独自エスケープ）へ
            直列化する。UTF-8 エンコード後に SHA-256 を計算し、小文字 hex で出力する。
            テストベクトルは tests/Amane.Mailer.Contracts.Tests/TestVectors/payload-hash-vectors.json。
            ADR は docs/adr/0012-mail-via-mailer-microservice.md D-05。
            .NET Consumer は MailPayloadHasher.ComputeDeliveryPayloadSha256Hex(request) を使用し、
            送信 JSON は null 任意フィールドを省略する設定に合わせる。
      example:
        tenant_id: "00000000-0000-0000-0000-000000000301"
        source_service: example-service
        mail_request_id: "018f7c2a-0000-7000-8000-000000000000"
        purpose: FormResponseNotification
        to:
          - email: user@example.com
            display_name: 山田太郎
        subject: お問い合わせを受け付けました
        text_body: "ご回答ありがとうございました。"
        html_body: "<p>ご回答ありがとうございました。</p>"
        metadata:
          form_id: "42"
        payload_hash: "9c24a8154fa03970c9a6512e680af20e2d64fa5555849b80525215a74388b8fe"

    MailRecipient:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: [string, "null"]

    MailRequestCreateResponse:
      type: object
      required: [mail_request_id, status]
      properties:
        mail_request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, already_accepted]
          description: API 受付ステータス（Worker の配送ステータスとは別）。

    MailRequestStatusResponse:
      type: object
      required:
        - mail_request_id
        - status
        - attempt_count
        - max_attempts
        - accepted_at
      properties:
        mail_request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, delivered, failed, dead_lettered, cancelled]
          description: Worker 配送ステータス（API 受付ステータス accepted / already_accepted とは別）。
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        next_attempt_at:
          type: [string, "null"]
          format: date-time
          description: 次回試行予定時刻（UTC）。queued で retry 待ちの場合のみ。
        scheduled_at:
          type: [string, "null"]
          format: date-time
          description: >-
            初回配送予定時刻（UTC）。null はスケジュールゲートなし。
            next_attempt_at（再試行）とは独立。
        accepted_at:
          type: string
          format: date-time
          description: 初回受付時刻（UTC）。
        delivered_at:
          type: [string, "null"]
          format: date-time
          description: 配送成功時刻（UTC）。status が delivered の場合のみ。
        last_error_code:
          type: [string, "null"]
          description: 直近試行の stable delivery error code（`MailDeliveryErrorCodes`。例: ACS_REQUEST_FAILED, PROVIDER_NETWORK, PROVIDER_UNKNOWN。raw provider message / exception 型名は含めない）。

    MailRequestRescheduleRequest:
      type: object
      additionalProperties: false
      properties:
        scheduled_at:
          type: [string, "null"]
          format: date-time
          description: >-
            新しい初回配送予定時刻（UTC）。null はスケジュール解除（即時）。
            過去時刻 / 30 日超は create と同じ 422 コード。

    MailDeliveryEventPayload:
      type: object
      additionalProperties: false
      description: >-
        配送結果 Webhook の JSON 本文。recipient / subject / body 等の PII は含まない。
        同一 mail request に対して 1 イベントのみ enqueue される。Consumer は event_id で重複排除する。
      required:
        - event_id
        - event_type
        - occurred_at
        - tenant_id
        - source_service
        - mail_request_id
        - status
        - attempt_count
      properties:
        event_id:
          type: string
          format: uuid
          description: イベント一意 ID。Webhook 再送時も同一値。
        event_type:
          type: string
          enum: [delivered, failed, dead_lettered, cancelled]
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        source_service:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,62}$'
        mail_request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [delivered, failed, dead_lettered, cancelled]
          description: 配送結果ステータス（#216 ステータス API と同一モデル）。
        attempt_count:
          type: integer
          minimum: 0
        last_error_code:
          type: [string, "null"]
          description: 最新 attempt の stable delivery error code（`MailDeliveryErrorCodes`。PII / exception 型名を含まない分類コード）。

    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - REQUEST_TOO_LARGE
            - SOURCE_SERVICE_NOT_ALLOWED
            - TOO_MANY_RECIPIENTS
            - IDEMPOTENCY_CONFLICT
            - INVALID_PAYLOAD_HASH
            - INVALID_METADATA
            - UNAUTHORIZED_TENANT
            - MAILER_TEMPORARILY_UNAVAILABLE
            - STORAGE_FULL
            - NOT_FOUND
            - SCHEDULED_AT_IN_PAST
            - SCHEDULED_AT_TOO_FAR
            - INVALID_STATE
        message:
          type: string
        retryable:
          type: boolean
          description: >-
            true の場合、呼び出し側はバックオフ後にリトライしてよい。
            STORAGE_FULL は disk 解放や retention 調整が必要な構造的事象のため false。
